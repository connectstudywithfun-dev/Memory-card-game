<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Memory Match - SuperApp</title>
    <style>
        :root {
            --bg-color: #f7f3f0;
            --card-bg: #ffffff;
            --text-main: #4a3b32;
            --text-muted: #8c786d;
            --primary: #964B00;
            --primary-hover: #783b00;
            --border-color: #e6dfdc;
            --card-back-1: #d7ccc8;
            --card-back-2: #bcaaa4;
            --card-front: #fffcf9;
            --success: #2e7d32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
        }

        .main-card-box {
            width: 100%;
            max-width: 520px;
            height: calc(100vh - 95px);
            background: var(--card-bg);
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(139, 69, 19, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 4px;
        }

        .brand-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
        }

        .settings-btn {
            background: #efebe9;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            background: #fdfbf7;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .stats-bar span span {
            color: var(--primary);
        }

        .memory-grid {
            display: grid;
            gap: 4px;
            width: 100%;
            flex-grow: 1;
            margin-bottom: 4px;
        }

        .memory-grid.easy {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
        }

        .memory-grid.hard {
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 2px;
        }

        .memory-card {
            background: linear-gradient(135deg, var(--card-back-1), var(--card-back-2));
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            color: transparent;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
            position: relative;
        }

        .easy .memory-card {
            font-size: 1.2rem;
        }

        .hard .memory-card {
            font-size: 0.8rem;
        }

        .memory-card:active {
            transform: scale(0.95);
            opacity: 0.85;
        }

        .memory-card::after {
            content: "Amrit";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.4rem;
            font-style: italic;
            font-weight: 400;
            color: rgba(74, 59, 50, 0.18);
            pointer-events: none;
        }

        .memory-card.flipped {
            background: var(--card-front);
            color: var(--text-main);
            border: 1.2px solid var(--primary);
        }

        .memory-card.matched {
            background: #e8f5e9;
            color: var(--success);
            border: 1.2px solid var(--success);
            cursor: default;
        }

        .controls {
            width: 100%;
        }

        button.action-btn {
            width: 100%;
            padding: 7px;
            font-size: 0.8rem;
            font-weight: 600;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            background-color: var(--primary);
            color: white;
            box-shadow: 0 2px 6px rgba(150, 75, 0, 0.15);
        }

        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(74, 59, 50, 0.35);
            backdrop-filter: blur(3px);
            border-radius: 16px;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: white;
            padding: 16px;
            border-radius: 12px;
            width: 80%;
            max-width: 280px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .modal-content h3 {
            margin-bottom: 6px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .modal-content p {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .setting-group {
            margin-bottom: 8px;
            text-align: left;
        }

        .setting-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }

        .mode-options {
            display: flex;
            gap: 4px;
        }

        .mode-btn {
            flex: 1;
            padding: 6px;
            border: 2px solid var(--border-color);
            background: white;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.75rem;
        }

        .mode-btn.active {
            border-color: var(--primary);
            background: #fdfbf7;
            color: var(--primary);
        }

        /* Footer container with full box width matching main card */
        footer {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 0.58rem;
            color: var(--text-muted);
            text-align: center;
        }

        footer strong {
            font-weight: 600;
            color: var(--primary);
            font-style: italic;
        }

        .google-ad-container {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 65px;
            min-height: 65px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="main-card-box">
            <div class="top-bar">
                <span class="brand-title">Memory card match</span>
                <button class="settings-btn" onclick="toggleSettings(true)" title="Settings">⚙️</button>
            </div>

            <div class="stats-bar">
                <span>Moves: <span id="moveCount">0</span></span>
                <span>Time: <span id="timer">00:00</span></span>
            </div>

            <div class="memory-grid easy" id="memoryGrid"></div>

            <div class="controls">
                <button class="action-btn" onclick="resetGame()">Restart Game</button>
            </div>

            <div class="modal" id="settingsModal">
                <div class="modal-content">
                    <h3>Game Settings</h3>
                    <div class="setting-group">
                        <label>Difficulty Mode:</label>
                        <div class="mode-options">
                            <button class="mode-btn active" id="easyDiffBtn" onclick="setDifficulty('easy')">Easy (16)</button>
                            <button class="mode-btn" id="hardDiffBtn" onclick="setDifficulty('hard')">Hard (40)</button>
                        </div>
                    </div>
                    <div class="setting-group">
                        <label>Content Theme:</label>
                        <div class="mode-options">
                            <button class="mode-btn active" id="emojiModeBtn" onclick="setType('emoji')">🍎 Emoji</button>
                            <button class="mode-btn" id="formulaModeBtn" onclick="setType('formula')">📐 Formula</button>
                        </div>
                    </div>
                    <button class="action-btn" onclick="applySettings()" style="margin-top: 4px;">Apply & Play</button>
                </div>
            </div>

            <div class="modal" id="winModal">
                <div class="modal-content">
                    <h3>🎉 Congratulations!</h3>
                    <p>You successfully matched all pairs!<br>Total Moves: <strong id="finalMoves">0</strong><br>Time Taken: <strong id="finalTime">00:00</strong></p>
                    <button class="action-btn" onclick="playAgain()">Once Again</button>
                </div>
            </div>
        </div>

        <footer>
            <div>
                Copyright &copy; All Right Reserved <strong>Amrit Bharadwaj</strong>
            </div>
            <div class="google-ad-container">
                <!-- Google AdSense Test Ad Unit (Full Width Custom Banner) -->
                <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940256099942544" crossorigin="anonymous"></script>
                <ins class="adsbygoogle"
                     style="display:inline-block;width:100%;height:65px"
                     data-ad-client="ca-pub-3940256099942544"
                     data-ad-slot="6300978111"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </footer>
    </div>

    <script>
        const masterEmojis = ['🍎', '🚀', '⚡', '💎', '🎨', '🔥', '🎯', '🧩', '🌟', '🍀', '🍕', '🎸', '⚽', '📚', '💡', '🏆', '🎧', '⌚', '🧸', '🎈', '🍉', '🚗', '🌵', '⚓', '👑', '🔮', '🦄', '🐝', '🍩', '🎁'];
        const masterFormulas = ['E=mc²', '∫f(x)', 'H₂SO₄', 'sin(θ)', 'ΔG<0', 'π ≈ 3.14', 'F=ma', 'log(x)', 'd/dx', 'cos(θ)', 'PV=nRT', 'a²+b²', 'lim x→0', 'Fe+O₂', 'm1v1', 'v = u+at', 's=ut+½at²', 'KE=½mv²', 'W=F.d', 'Q=mcΔT', 'sin²x', 'cos²x', 'e^x', '∇×F', '∮', 'ħ', 'α', 'β', 'γ', 'λ'];
        
        let currentType = 'emoji';       
        let currentDiff = 'easy';       
        let gameCards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timerInterval = null;
        let seconds = 0;
        let isLocked = false;

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            seconds = 0;
            document.getElementById('timer').innerText = "00:00";
            timerInterval = setInterval(() => {
                seconds++;
                let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                let secs = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function initGame() {
            document.getElementById('winModal').style.display = 'none';
            const grid = document.getElementById('memoryGrid');
            grid.innerHTML = '';
            grid.className = `memory-grid ${currentDiff}`;

            const pairCount = currentDiff === 'easy' ? 8 : 20;

            let sourcePool = currentType === 'emoji' ? masterEmojis : masterFormulas;
            let shuffledPool = shuffle(sourcePool);
            let selectedPairs = shuffledPool.slice(0, pairCount);

            gameCards = shuffle([...selectedPairs, ...selectedPairs]);
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            isLocked = false;
            document.getElementById('moveCount').innerText = moves;
            startTimer();

            gameCards.forEach((val, idx) => {
                const card = document.createElement('div');
                card.classList.add('memory-card');
                card.dataset.value = val;
                card.dataset.index = idx;
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });
        }

        function flipCard() {
            if (isLocked) return;
            if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

            this.classList.add('flipped');
            this.innerText = this.dataset.value;
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moveCount').innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const targetPairs = currentDiff === 'easy' ? 8 : 20;
            
            if (card1.dataset.value === card2.dataset.value) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                flippedCards = [];
                matchedPairs++;

                if (matchedPairs === targetPairs) {
                    clearInterval(timerInterval);
                    setTimeout(() => {
                        showWinScreen();
                    }, 300);
                }
            } else {
                isLocked = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card1.innerText = '';
                    card2.classList.remove('flipped');
                    card2.innerText = '';
                    flippedCards = [];
                    isLocked = false;
                }, 500); 
            }
        }

        function showWinScreen() {
            document.getElementById('finalMoves').innerText = moves;
            document.getElementById('finalTime').innerText = document.getElementById('timer').innerText;
            document.getElementById('winModal').style.display = 'flex';
        }

        function playAgain() {
            initGame();
        }

        function toggleSettings(show) {
            document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
            updateModalButtons();
        }

        function setDifficulty(diff) {
            currentDiff = diff;
            updateModalButtons();
        }

        function setType(type) {
            currentType = type;
            updateModalButtons();
        }

        function applySettings() {
            toggleSettings(false);
            initGame();
        }

        function updateModalButtons() {
            document.getElementById('easyDiffBtn').classList.toggle('active', currentDiff === 'easy');
            document.getElementById('hardDiffBtn').classList.toggle('active', currentDiff === 'hard');
            document.getElementById('emojiModeBtn').classList.toggle('active', currentType === 'emoji');
            document.getElementById('formulaModeBtn').classList.toggle('active', currentType === 'formula');
        }

        function resetGame() {
            initGame();
        }

        window.onload = () => {
            initGame();
            updateModalButtons();
        };
    </script>
</body>
                                                                                                </html>

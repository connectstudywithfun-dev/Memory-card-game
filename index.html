<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Memory Card Match - a free brain-training card matching game with emoji and formula themes.">
<meta name="theme-color" content="#f7f3f0">
<title>Memory Card Match - Amrit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<style>
:root{
  --bg:#f7f3f0; --card:#fff; --text:#4a3b32; --muted:#8c786d; --primary:#964B00;
  --border:#d8ceca; --back1:#d7ccc8; --back2:#bcaaa4; --front:#fffcf9; --ok:#2e7d32;
  --adbar:#ece7e2;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center}
main{flex:1;width:100%;display:flex;justify-content:center;align-items:center;padding:8px}

.game{width:100%;max-width:640px;background:var(--card);padding:14px;border-radius:14px;
  box-shadow:0 6px 20px rgba(139,69,19,.08);border:1px solid var(--border);position:relative}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.brand{font-size:1.4rem;font-weight:700;color:var(--primary)}
.icon-btn{background:#f0eae5;border:0;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.15rem}
.stats{display:flex;justify-content:space-between;margin-bottom:10px;font-size:1rem;font-weight:600;
  color:var(--muted);background:#fdfbf7;padding:8px 14px;border-radius:6px;border:1px solid var(--border)}
.stats b{color:var(--primary)}

.grid{--avail:calc(100dvh - 330px);display:grid;gap:8px;background:#bfa79e;padding:10px;border-radius:12px;
  margin:0 auto 12px;container-type:inline-size;
  width:min(100%,max(calc(var(--avail) * var(--ratio)),340px))}
.grid.easy{--ratio:1;grid-template-columns:repeat(4,1fr)}
.grid.hard{--ratio:.62;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px}

.mcard{background:linear-gradient(135deg,var(--back1),var(--back2));border-radius:6px;aspect-ratio:1;
  display:flex;justify-content:center;align-items:center;text-align:center;font-weight:700;color:transparent;
  cursor:pointer;user-select:none;-webkit-user-select:none;overflow:hidden;position:relative;line-height:1.1;
  box-shadow:inset 0 1px 2px rgba(255,255,255,.4),0 1px 3px rgba(0,0,0,.08);transition:transform .1s ease}
.easy .mcard{font-size:11cqw}
.hard .mcard{font-size:7.5cqw}
.formula.easy .mcard{font-size:4.2cqw}
.formula.hard .mcard{font-size:2.9cqw}
.mcard:active{transform:scale(.92)}
/* watermark only on card back */
.mcard:not(.flipped):not(.matched)::after{content:"Amrit";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);font-size:3.2cqw;font-family:'Brush Script MT','Lucida Handwriting',cursive;
  font-style:italic;font-weight:900;color:rgba(74,59,50,.4);pointer-events:none}
.mcard.flipped{background:var(--front);color:var(--text);border:1.5px solid var(--primary)}
.mcard.matched{background:#e8f5e9;color:var(--ok);border:1.5px solid var(--ok);cursor:default}

.action{width:100%;padding:13px;font-size:1.05rem;font-weight:600;border:0;border-radius:6px;cursor:pointer;
  background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(150,75,0,.2)}

.modal{display:none;position:absolute;inset:0;background:rgba(74,59,50,.4);backdrop-filter:blur(4px);
  border-radius:14px;justify-content:center;align-items:center;z-index:10}
.modal-box{background:#fff;padding:18px;border-radius:10px;width:85%;max-width:280px;text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,.15)}
.modal-box h3{margin-bottom:8px;font-size:1.05rem}
.modal-box p{font-size:.85rem;color:var(--muted);margin-bottom:12px;line-height:1.5}
.setting{margin-bottom:10px;text-align:left}
.setting label{font-size:.75rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.opts{display:flex;gap:6px}
.opt{flex:1;padding:8px 4px;border:2px solid var(--border);background:#fff;border-radius:6px;font-weight:600;
  cursor:pointer;color:var(--text);font-size:.75rem}
.opt.active{border-color:var(--primary);background:#fdfbf7;color:var(--primary)}
.link-btn{background:none;border:0;color:var(--muted);font-size:.75rem;margin-top:8px;cursor:pointer;text-decoration:underline}

/* Footer: copyright text + 320x50 ad strip, like the reference screenshot */
footer{width:100%;text-align:center;margin-top:auto}
.copy{font-size:.85rem;color:var(--muted);padding:14px 10px}
.copy strong{color:var(--primary);font-style:italic;font-weight:600}
.adbar{width:100%;background:var(--adbar);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center}
.adslot{position:relative;min-width:320px;min-height:50px;max-width:100%;background:#fff;display:flex;justify-content:center;align-items:center;overflow:hidden}
.ad-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#e8f0fe;color:#1a56c4;font-size:.75rem;font-weight:600;border:1px dashed #9bb7ea}
</style>
</head>
<body>
<div class="page">
  <main>
    <div class="game" id="game">
      <div class="top-bar">
        <span class="brand">Memory Card Match</span>
        <button class="icon-btn" id="openSettings" title="Settings" aria-label="Settings">⚙️</button>
      </div>

      <div class="stats">
        <span>Moves: <b id="moveCount">0</b></span>
        <span>Time: <b id="timer">00:00</b></span>
      </div>

      <div class="grid easy" id="grid"></div>
      <button class="action" id="restartBtn">Restart Game</button>

      <div class="modal" id="settingsModal">
        <div class="modal-box">
          <h3>Game Settings</h3>
          <div class="setting">
            <label>Difficulty Mode</label>
            <div class="opts">
              <button class="opt active" id="easyBtn">Easy (16)</button>
              <button class="opt" id="hardBtn">Hard (40)</button>
            </div>
          </div>
          <div class="setting">
            <label>Content Theme</label>
            <div class="opts">
              <button class="opt active" id="emojiBtn">🍎 Emoji</button>
              <button class="opt" id="formulaBtn">📐 Formula</button>
            </div>
          </div>
          <button class="action" id="applyBtn">Apply &amp; Play</button>
          <button class="link-btn" id="closeSettings">Cancel</button>
        </div>
      </div>

      <div class="modal" id="winModal">
        <div class="modal-box">
          <h3>🎉 Congratulations!</h3>
          <p>You matched all pairs!<br>Total Moves: <strong id="finalMoves">0</strong><br>Time Taken: <strong id="finalTime">00:00</strong></p>
          <button class="action" id="againBtn">Once Again</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="copy">Copyright &copy; <strong>Amrit Bharadwaj</strong> All Rights Reserved</div>
    <div class="adbar">
      <div class="adslot" id="adslot">
        <div class="ad-fallback" id="adFallback">Ad loading… (320×50)</div>
      </div>
    </div>
  </footer>
</div>

<script>
/* ============ TEST AD (Google Publisher Tag) ============
   Google's official sample ad unit: serves real *test* ads on any website,
   no account or approval needed. Replace AD_UNIT with your own later. */
const AD_UNIT = "/6355419/Travel/Europe/France/Paris";
(function loadTestAd(){
  const slotDiv = document.createElement("div");
  slotDiv.id = "test-ad";
  document.getElementById("adslot").appendChild(slotDiv);

  const g = document.createElement("script");
  g.async = true; g.crossOrigin = "anonymous";
  g.src = "https://securepubads.g.doubleclick.net/tag/js/gpt.js";
  document.head.appendChild(g);

  window.googletag = window.googletag || { cmd: [] };
  let triedBig = false;
  const fb = () => document.getElementById("adFallback");

  function request(size){
    googletag.cmd.push(() => {
      const old = googletag.pubads().getSlots();
      if (old.length) googletag.destroySlots(old);
      googletag.defineSlot(AD_UNIT, size, "test-ad").addService(googletag.pubads());
      googletag.enableServices();
      googletag.display("test-ad");
    });
  }
  googletag.cmd.push(() => {
    googletag.pubads().addEventListener("slotRenderEnded", e => {
      if (e.isEmpty) {
        if (!triedBig) { triedBig = true; request([300, 250]); }   // sample unit reliably fills 300x250
        else fb().textContent = "Ad space (320×50)";
      } else {
        fb().style.display = "none";
      }
    });
  });
  request([320, 50]);
  setTimeout(() => { if (fb().style.display !== "none") fb().textContent = "Ad space (320×50)"; }, 5000);
})();

/* ================= GAME ================= */
const EMOJIS = ['🍎','🚀','⚡','💎','🎨','🔥','🎯','🧩','🌟','🍀','🍕','🎸','⚽','📚','💡','🏆','🎧','⌚','🧸','🎈','🍉','🚗','🌵','⚓','👑','🔮','🦄','🐝','🍩','🎁'];
const FORMULAS = ['E=mc²','∫f(x)','H₂SO₄','sin(θ)','ΔG<0','π≈3.14','F=ma','log(x)','d/dx','cos(θ)','PV=nRT','a²+b²','lim x→0','Fe+O₂','m₁v₁','v=u+at','s=ut+½at²','KE=½mv²','W=F·d','Q=mcΔT','sin²x','cos²x','eˣ','∇×F','∮','ħ','α','β','γ','λ'];

let type='emoji', diff='easy';               // applied settings
let pType='emoji', pDiff='easy';             // pending (in modal)
let flipped=[], matched=0, moves=0, secs=0, timer=null, locked=false, started=false;

const $ = id => document.getElementById(id);

function shuffle(a){
  const r=[...a];
  for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}
  return r;
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function stopTimer(){clearInterval(timer);timer=null;}
function startTimer(){
  stopTimer();
  timer=setInterval(()=>{secs++;$('timer').textContent=fmt(secs);},1000);
}

function init(){
  stopTimer(); secs=0; started=false;
  $('timer').textContent='00:00';
  $('winModal').style.display='none';
  const grid=$('grid');
  grid.innerHTML='';
  grid.className='grid '+diff+(type==='formula'?' formula':'');
  const pairs = diff==='easy'?8:20;
  const pool = shuffle(type==='emoji'?EMOJIS:FORMULAS).slice(0,pairs);
  flipped=[]; matched=0; moves=0; locked=false;
  $('moveCount').textContent=0;
  shuffle([...pool,...pool]).forEach(v=>{
    const c=document.createElement('div');
    c.className='mcard'; c.dataset.value=v;
    c.addEventListener('click',()=>flip(c));
    grid.appendChild(c);
  });
}

function flip(c){
  if(locked||c.classList.contains('flipped')||c.classList.contains('matched')) return;
  if(!started){started=true;startTimer();}       // timer starts on first tap
  c.classList.add('flipped'); c.textContent=c.dataset.value;
  flipped.push(c);
  if(flipped.length===2){
    moves++; $('moveCount').textContent=moves;
    check();
  }
}

function check(){
  const [a,b]=flipped;
  if(a.dataset.value===b.dataset.value){
    a.classList.replace('flipped','matched'); b.classList.replace('flipped','matched');
    flipped=[]; matched++;
    if(matched===(diff==='easy'?8:20)){
      stopTimer();
      setTimeout(()=>{
        $('finalMoves').textContent=moves;
        $('finalTime').textContent=fmt(secs);
        $('winModal').style.display='flex';
      },300);
    }
  } else {
    locked=true;
    setTimeout(()=>{
      [a,b].forEach(x=>{x.classList.remove('flipped');x.textContent='';});
      flipped=[]; locked=false;
    },600);
  }
}

function paintModal(){
  $('easyBtn').classList.toggle('active',pDiff==='easy');
  $('hardBtn').classList.toggle('active',pDiff==='hard');
  $('emojiBtn').classList.toggle('active',pType==='emoji');
  $('formulaBtn').classList.toggle('active',pType==='formula');
}
function openSettings(){pDiff=diff;pType=type;paintModal();$('settingsModal').style.display='flex';}
function closeSettings(){$('settingsModal').style.display='none';}

$('openSettings').onclick=openSettings;
$('closeSettings').onclick=closeSettings;
$('easyBtn').onclick=()=>{pDiff='easy';paintModal();};
$('hardBtn').onclick=()=>{pDiff='hard';paintModal();};
$('emojiBtn').onclick=()=>{pType='emoji';paintModal();};
$('formulaBtn').onclick=()=>{pType='formula';paintModal();};
$('applyBtn').onclick=()=>{diff=pDiff;type=pType;closeSettings();init();};
$('restartBtn').onclick=init;
$('againBtn').onclick=init;

init();
</script>
</body>
</html>
